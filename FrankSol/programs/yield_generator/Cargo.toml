[package]
name = "yield_generator"
version = "0.1.0"
description = "External yield simulation program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "yield_generator"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang-v2/idl-build"]

[dependencies]
anchor-lang-v2 = { git = "https://github.com/solana-foundation/anchor.git", branch = "anchor-next", default-features = false, features = ["alloc"] }
pinocchio = { version = "0.11", default-features = false, features = ["copy"] }
pinocchio-system = "0.6"
bytemuck = { version = "1", features = ["derive"] }
borsh = { version = "1", optional = true }
wincode = { version = "0.5", features = ["derive"] }
solana-program-log = { version = "1.1", features = ["macro"] }
solana-program-error = { version = "3.0", features = ["borsh"] }

[dev-dependencies]
litesvm = "0.11.0"
solana-keypair = "3.0.1"
solana-clock = "3.0.0"
solana-instruction = "3.0.1"
solana-message = "3.0.1"
solana-pubkey = "3.0.0"
solana-rent = "3.0.0"
solana-signer = "3.0.0"
solana-transaction = "3.0.2"
